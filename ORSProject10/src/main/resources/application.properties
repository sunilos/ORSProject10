#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
server.port = 8080
spring.application.name = ORSP10

#pagination
page.size=10

##Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/ORS_P10?useSSL=false
spring.datasource.username = root
spring.datasource.password =


## Hibernate/JPA  Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update


#Email properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourgmail@gmail.com
spring.mail.password=yourpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

## JWT (secret must be at least 32 chars / 256 bits for HS256)
jwt.secret=ORSProject10JwtSigningSecretKey2026ChangeMe!!
jwt.expiration=86400000

## Profile photo storage (folder on disk where uploaded profile photos are saved)
user.dir=F:/temp/project10
photo.base-path=${user.dir}/uploads/profile-photos

# File storage location
document.upload-dir=F:/temp/project10/uploads/

## Multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

## Logging
logging.file.name=F:/temp/project10/logs/ors-project10.log
